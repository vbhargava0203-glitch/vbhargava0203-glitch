<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 202" role="img" aria-labelledby="title desc">
  <title id="title">BHARGAVA.OS system status</title>
  <desc id="desc">Building, working from home. Focus areas: AI engineering, full stack, data engineering, security, and 3D interfaces.</desc>
  <style>
    text{font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;fill:#c9d1d9}.label{font-size:15px;fill:#8b949e;letter-spacing:1.5px}.value{font-size:22px;font-weight:600}.small{font-size:18px}.dot{fill:#3fb950;animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.scan{animation:scan 6s linear infinite}
    @keyframes pulse{50%{opacity:.45;transform:scale(.78)}}@keyframes scan{to{transform:translateY(168px)}}
    @media(prefers-reduced-motion:reduce){.dot,.scan{animation:none}.dot{opacity:1}}
  </style>
  <defs><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#161b22"/><stop offset="1" stop-color="#101923"/></linearGradient><clipPath id="clip"><rect x="1" y="1" width="718" height="198" rx="18"/></clipPath></defs>
  <rect x="1" y="1" width="718" height="198" rx="18" fill="url(#card)" stroke="#30363d" stroke-width="2"/>
  <g clip-path="url(#clip)"><path class="scan" d="M10 42h700" stroke="#39d0d8" stroke-opacity=".12" stroke-width="22"/></g>
  <text class="label" x="28" y="38">CURRENT STATE</text><circle class="dot" cx="683" cy="31" r="8"/>
  <text class="value" x="28" y="82">BUILDING <tspan fill="#8b949e">/</tspan> WORKING FROM HOME</text>
  <path d="M28 103h664" stroke="#30363d"/>
  <text class="label" x="28" y="132">ACTIVE SYSTEMS</text>
  <text class="small" x="28" y="169">AI engineering · Web / Full-stack · Data engineering</text>
  <text class="small" x="28" y="192">Security · 3D interfaces</text>
</svg>
