<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 84" role="img" aria-labelledby="title desc">
  <title id="title">Technology marquee</title>
  <desc id="desc">C, Python, JavaScript, SQL, React, Three.js, Node.js, Flask, PostgreSQL, MongoDB, Pandas, NumPy, scikit-learn, Streamlit, Plotly, Git, GitHub, Netlify, VS Code, and Postman.</desc>
  <style>
    text{font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:20px;font-weight:600;fill:#c9d1d9}.chip{fill:#161b22;stroke:#30363d}.belt{animation:scroll 6s linear infinite}
    @keyframes scroll{to{transform:translateX(-720px)}}@media(prefers-reduced-motion:reduce){.belt{animation:none}}
  </style>
  <defs><linearGradient id="fade"><stop stop-color="#0d1117"/><stop offset=".12" stop-color="#0d1117" stop-opacity="0"/><stop offset=".88" stop-color="#0d1117" stop-opacity="0"/><stop offset="1" stop-color="#0d1117"/></linearGradient><clipPath id="window"><rect width="720" height="84" rx="14"/></clipPath></defs>
  <rect x="1" y="1" width="718" height="82" rx="14" fill="#0d1117" stroke="#30363d"/>
  <g clip-path="url(#window)"><g class="belt">
    <g transform="translate(14 18)"><rect class="chip" width="72" height="48" rx="12"/><text x="36" y="31" text-anchor="middle">C</text></g>
    <g transform="translate(96 18)"><rect class="chip" width="98" height="48" rx="12"/><text x="49" y="31" text-anchor="middle">Python</text></g>
    <g transform="translate(204 18)"><rect class="chip" width="106" height="48" rx="12"/><text x="53" y="31" text-anchor="middle">JavaScript</text></g>
    <g transform="translate(320 18)"><rect class="chip" width="76" height="48" rx="12"/><text x="38" y="31" text-anchor="middle">SQL</text></g>
    <g transform="translate(406 18)"><rect class="chip" width="82" height="48" rx="12"/><text x="41" y="31" text-anchor="middle">React</text></g>
    <g transform="translate(498 18)"><rect class="chip" width="98" height="48" rx="12"/><text x="49" y="31" text-anchor="middle">Three.js</text></g>
    <g transform="translate(606 18)"><rect class="chip" width="100" height="48" rx="12"/><text x="50" y="31" text-anchor="middle">Node.js</text></g>
    <g transform="translate(720 0)">
      <g transform="translate(14 18)"><rect class="chip" width="72" height="48" rx="12"/><text x="36" y="31" text-anchor="middle">C</text></g>
      <g transform="translate(96 18)"><rect class="chip" width="98" height="48" rx="12"/><text x="49" y="31" text-anchor="middle">Python</text></g>
      <g transform="translate(204 18)"><rect class="chip" width="106" height="48" rx="12"/><text x="53" y="31" text-anchor="middle">JavaScript</text></g>
      <g transform="translate(320 18)"><rect class="chip" width="76" height="48" rx="12"/><text x="38" y="31" text-anchor="middle">SQL</text></g>
      <g transform="translate(406 18)"><rect class="chip" width="82" height="48" rx="12"/><text x="41" y="31" text-anchor="middle">React</text></g>
      <g transform="translate(498 18)"><rect class="chip" width="98" height="48" rx="12"/><text x="49" y="31" text-anchor="middle">Three.js</text></g>
      <g transform="translate(606 18)"><rect class="chip" width="100" height="48" rx="12"/><text x="50" y="31" text-anchor="middle">Node.js</text></g>
    </g>
  </g><rect width="720" height="84" fill="url(#fade)"/></g>
</svg>
