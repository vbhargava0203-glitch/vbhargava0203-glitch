<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 168" role="img" aria-labelledby="title desc">
  <title id="title">BHARGAVA.OS contact terminal</title>
  <desc id="desc">Animated terminal with glowing LinkedIn, Portfolio, and GitHub buttons; matching links follow below. Email is to be added.</desc>
  <style>
    text{font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;font-size:17px;fill:#c9d1d9}.muted{fill:#8b949e}.cyan{fill:#39d0d8}.green{fill:#3fb950}.cursor{animation:blink 1.2s steps(2,start) infinite}.pulse{animation:glow 3s ease-in-out infinite}.b2{animation-delay:.5s}.b3{animation-delay:1s}
    @keyframes blink{to{opacity:0}}@keyframes glow{50%{opacity:.55}}@media(prefers-reduced-motion:reduce){.cursor,.pulse{animation:none}}
  </style>
  <defs><filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect x="1" y="1" width="718" height="166" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M2 43h716" stroke="#30363d"/><circle cx="24" cy="22" r="6" fill="#f85149"/><circle cx="46" cy="22" r="6" fill="#d29922"/><circle cx="68" cy="22" r="6" fill="#3fb950"/><text class="muted" x="94" y="28">connect · bhargava.os</text>
  <text x="28" y="68"><tspan class="cyan">$</tspan><tspan> open collaboration_channel</tspan></text>
  <text x="28" y="83"><tspan class="green pulse">[ READY ]</tspan><tspan> collaboration channel open</tspan></text>
  <g class="pulse"><rect x="28" y="91" width="190" height="38" rx="11" fill="#161b22" stroke="#58a6ff" filter="url(#glow)"/><text x="123" y="116" text-anchor="middle">LinkedIn</text></g>
  <g class="pulse b2"><rect x="230" y="91" width="190" height="38" rx="11" fill="#161b22" stroke="#a371f7" filter="url(#glow)"/><text x="325" y="116" text-anchor="middle">Portfolio</text></g>
  <g class="pulse b3"><rect x="432" y="91" width="190" height="38" rx="11" fill="#161b22" stroke="#39d0d8" filter="url(#glow)"/><text x="527" y="116" text-anchor="middle">GitHub</text></g>
  <text x="28" y="148"><tspan class="muted">email: [ADD DATA]</tspan><tspan class="cursor" fill="#39d0d8"> ▋</tspan></text>
</svg>
