<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 52" role="img" aria-labelledby="title desc">
  <title id="title">Project flow animation</title>
  <desc id="desc">A cyan signal loops along a blue system flow line.</desc>
  <style>
    .track{stroke:#58a6ff;stroke-opacity:.42;stroke-width:3;stroke-dasharray:5 8}.node{fill:#161b22;stroke:#30363d;stroke-width:2}.pulse{fill:#39d0d8;filter:url(#glow);animation:move 3s ease-in-out alternate infinite}
    @keyframes move{0%{transform:translateX(34px)}100%{transform:translateX(332px)}}@media(prefers-reduced-motion:reduce){.pulse{animation:none;transform:translateX(183px)}}
  </style>
  <defs><filter id="glow" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <path class="track" d="M35 26H365"/><circle class="node" cx="35" cy="26" r="8"/><circle class="node" cx="365" cy="26" r="8"/><circle class="pulse" cx="0" cy="26" r="6"/>
</svg>
